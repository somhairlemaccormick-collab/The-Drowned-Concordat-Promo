name: Book Promo Automation

on:
  schedule:
    # Every day at 17:00 UTC (18:00 Amsterdam in winter, 19:00 in summer)
    - cron: '0 17 * * *'
  workflow_dispatch: # Run it by hand from the Actions tab
    inputs:
      dry_run:
        description: 'Make the card but do NOT post to Instagram'
        type: boolean
        default: true

permissions:
  contents: write # needed to commit each day's card so Instagram can fetch it

concurrency:
  group: promo
  cancel-in-progress: false

jobs:
  run-poster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pillow

      - name: Make today's card
        run: python auto_poster.py build

      - name: Publish the card to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git commit -m "Daily promo card (run ${{ github.run_number }})"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Send to Make (Instagram)
        env:
          SOCIAL_WEBHOOK_URL: ${{ secrets.SOCIAL_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python auto_poster.py post
