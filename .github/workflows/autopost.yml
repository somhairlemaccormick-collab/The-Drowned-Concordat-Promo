name: Book Promo Automation

on:
  schedule:
    # Times are UTC (Amsterdam is +1 in winter, +2 in summer)
    - cron: '37 7 * * *'    # every day: morning quote card (test slot)
    - cron: '7 17 * * *'    # every day: evening quote card
    - cron: '13 10 * * 3'   # Wednesday extra: website card
    - cron: '13 10 * * 6'   # Saturday extra: Amazon card
    - cron: '23 12 * * *'   # every day: Reel video (also saved to Drive for TikTok)
    - cron: '13 10 * * 1'   # Monday extra: carousel
    - cron: '13 10 * * 5'   # Friday extra: carousel
  workflow_dispatch: # Run it by hand from the Actions tab
    inputs:
      kind:
        description: 'Which card to make'
        type: choice
        options: [quote, reel, carousel, website, amazon]
        default: quote
      slot:
        description: 'Quote cards only: morning or evening slot'
        type: choice
        options: [pm, am]
        default: pm
      dry_run:
        description: 'Make the card but do NOT post to Instagram'
        type: boolean
        default: true

permissions:
  contents: write # needed to commit each day's card so Instagram can fetch it

concurrency:
  group: promo
  cancel-in-progress: false

jobs:
  run-poster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pillow imageio-ffmpeg

      - name: Make today's card
        env:
          POST_KIND: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.kind
             || github.event.schedule == '13 10 * * 3' && 'website'
             || github.event.schedule == '13 10 * * 6' && 'amazon'
             || github.event.schedule == '23 12 * * *' && 'reel'
             || github.event.schedule == '13 10 * * 1' && 'carousel'
             || github.event.schedule == '13 10 * * 5' && 'carousel'
             || 'quote' }}
          POST_SLOT: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.slot
             || github.event.schedule == '37 7 * * *' && 'am'
             || 'pm' }}
        run: python auto_poster.py build

      - name: Publish the card to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated log
          git commit -m "Daily promo post (run ${{ github.run_number }})"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "PUBLISHED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Send to Make (Instagram)
        env:
          SOCIAL_WEBHOOK_URL: ${{ secrets.SOCIAL_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          # Carousels are only sent once Make has a carousel route: set the repo
          # variable CAROUSELS_ENABLED to true (Settings > Secrets and variables > Actions > Variables)
          CAROUSELS_ENABLED: ${{ vars.CAROUSELS_ENABLED }}
        run: python auto_poster.py post
