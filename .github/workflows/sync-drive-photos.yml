# Daily: copies new images from the Google Drive folder "Drowned Concordat Content Photos"
# into backgrounds/, so the Instagram cards and Reels start using them.
# The folder must be shared as "Anyone with the link: Viewer" (no Google login is used).
name: Sync Drive photos

on:
  schedule:
    - cron: '17 5 * * *'   # daily, before the morning post
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promo
  cancel-in-progress: false

env:
  FOLDER_URL: https://drive.google.com/drive/folders/19Umdpw3q7bMOWCHX0KihFiLLtML-967L

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q gdown pillow pillow-heif
      - name: Download the folder
        run: |
          gdown --folder "$FOLDER_URL" -O dl --quiet || {
            echo "::warning::Could not read the Drive folder. Is it shared as 'Anyone with the link: Viewer'? (An empty folder also ends up here.)"; mkdir -p dl; }
          find dl -type f | head -60
      - name: Add new images
        run: python tools/sync_drive_photos.py dl
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backgrounds ready_posts 2>/dev/null || git add backgrounds
          git commit -m "New images from the Drive photos folder" || { echo "No new images."; exit 0; }
          git pull --rebase origin main
          git push origin HEAD:main
