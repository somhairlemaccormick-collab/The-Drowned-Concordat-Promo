# Quick voice audition for the talking-author videos: the same line in several Scottish voices
# (Piper's "alan" and the Scottish male speakers in the VCTK set, Edinburgh first).
# Results are pushed to the author-media-samples branch.
name: Voice samples

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-22.04
    env:
      RESULTS: samples
      BRANCH: samples
    steps:
      - uses: actions/checkout@v4
      - name: Piper (text-to-speech)
        run: |
          curl -sSL https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz | tar xz
          echo "$PWD/piper" >> $GITHUB_PATH
          H=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_GB
          curl -sSL -o alan.onnx $H/alan/medium/en_GB-alan-medium.onnx
          curl -sSL -o alan.onnx.json $H/alan/medium/en_GB-alan-medium.onnx.json
          curl -sSL -o vctk.onnx $H/vctk/medium/en_GB-vctk-medium.onnx
          curl -sSL -o vctk.onnx.json $H/vctk/medium/en_GB-vctk-medium.onnx.json
      - name: Render samples
        run: |
          set -o pipefail
          {
          sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p samples
          LINE="The sea took the world we knew. What was left of Europe now lives behind the Bulwark, in a place called the Delta. I'm Hamish Rannoch."
          echo "$LINE" | piper --model alan.onnx --length_scale 1.08 --output_file samples/alan.wav
          for spk in p252 p263 p272 p281 p284 p285 p237 p241 p246 p247 p271; do
            id=$(python3 -c "import json; m=json.load(open('vctk.onnx.json'))['speaker_id_map']; print(m.get('$spk',''))")
            [ -z "$id" ] && { echo "no $spk"; continue; }
            echo "$LINE" | piper --model vctk.onnx --speaker $id --length_scale 1.1 --output_file samples/vctk-$spk.wav
          done
          cd samples && for f in *.wav; do ffmpeg -v error -y -i $f -b:a 128k ${f%.wav}.mp3 && rm $f; done && ls
          } 2>&1 | tee -a log.txt
      - name: Save results to the author-media branch
        if: always()
        run: |
          mkdir -p pub && cp -r $RESULTS pub/ 2>/dev/null || true
          cp log.txt pub/ 2>/dev/null || true
          cd pub && git init -q -b author-media && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "$GITHUB_WORKFLOW run $GITHUB_RUN_NUMBER"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/author-media-$BRANCH
