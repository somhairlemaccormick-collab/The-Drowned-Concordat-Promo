# Quick voice audition for the talking-author videos: the same line in several voices.
# Input: space-separated list of lang/voice/quality[:speaker], e.g. en_GB/vctk/medium:p245
# Results are pushed to the author-media-samples branch.
name: Voice samples

on:
  workflow_dispatch:
    inputs:
      voices:
        description: 'Voices to render'
        default: 'en_GB/alan/medium en_GB/vctk/medium:p252'

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-22.04
    env:
      RESULTS: samples
      BRANCH: samples
    steps:
      - uses: actions/checkout@v4
      - name: Render samples
        run: |
          set -o pipefail
          {
          sudo apt-get install -y -qq ffmpeg > /dev/null
          curl -sSL https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz | tar xz
          mkdir -p samples models
          LINE="The sea took the world we knew. What was left of Europe now lives behind the Bulwark, in a place called the Delta. I'm Hamish Rannoch."
          for v in ${{ inputs.voices }}; do
            path=${v%%:*}; spk=""; [ "$v" != "$path" ] && spk=${v#*:}
            lang=${path%%/*}; rest=${path#*/}; name=${rest%%/*}; q=${rest#*/}
            file=$lang-$name-$q; m=models/$file.onnx
            if [ ! -f $m ]; then
              B=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/${lang%%_*}/$lang/$name/$q
              curl -sSfL -o $m $B/$file.onnx && curl -sSfL -o $m.json $B/$file.onnx.json || { echo "missing $file"; continue; }
            fi
            arg=""; out=$name
            if [ -n "$spk" ]; then
              id=$(python3 -c "import json; print(json.load(open('$m.json'))['speaker_id_map'].get('$spk',''))")
              [ -z "$id" ] && { echo "no speaker $spk in $file"; python3 -c "import json; print(list(json.load(open('$m.json'))['speaker_id_map'])[:40])"; continue; }
              arg="--speaker $id"; out=$name-$spk
            fi
            echo "$LINE" | ./piper/piper --model $m $arg --length_scale 1.08 --output_file samples/$out.wav
          done
          cd samples && for f in *.wav; do ffmpeg -v error -y -i $f -b:a 128k ${f%.wav}.mp3 && rm $f; done && ls
          } 2>&1 | tee -a log.txt
      - name: Save results to the author-media branch
        if: always()
        run: |
          mkdir -p pub && cp -r $RESULTS pub/ 2>/dev/null || true
          cp log.txt pub/ 2>/dev/null || true
          cd pub && git init -q -b author-media && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "$GITHUB_WORKFLOW run $GITHUB_RUN_NUMBER"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/author-media-$BRANCH
