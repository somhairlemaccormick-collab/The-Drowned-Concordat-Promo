# Renders "Hamish talks about the book" episodes into the queue (author/rendered/), ahead of time.
# Runs at night and keeps a buffer of up to 4 episodes ready (each takes a few minutes). Posting is a separate, quick job: author-post.yml.
name: Author Shorts - render

on:
  # schedule switched on once the first episode is approved:
  # schedule:
  #   - cron: '23 1 * * *'   # nightly, 01:23 UTC
  workflow_dispatch:
    inputs:
      id:
        description: 'Episode id to (re-)render (blank = next one not yet rendered)'
        default: ''

permissions:
  contents: write

concurrency:
  group: author-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Is the queue full?
        id: queue
        run: |
          ready=0
          for f in author/rendered/*.mp4; do [ -e "$f" ] || continue; id=$(basename "$f" .mp4); grep -qx "$id" author/posted.txt 2>/dev/null || ready=$((ready+1)); done
          echo "$ready episode(s) waiting in the queue"
          if [ -z "${{ inputs.id }}" ] && [ $ready -ge 4 ]; then echo "full=1" >> $GITHUB_OUTPUT; fi

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.full != '1'
        with:
          python-version: '3.8'

      - name: Tools
        if: steps.queue.outputs.full != '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1 > /dev/null
          pip install -q pillow
          curl -sSL https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz | tar xz
          H=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_GB/vctk/medium
          curl -sSfL -o vctk.onnx $H/en_GB-vctk-medium.onnx
          curl -sSfL -o vctk.onnx.json $H/en_GB-vctk-medium.onnx.json

      - name: Voice
        id: voice
        if: steps.queue.outputs.full != '1'
        run: |
          if python author/make_episode.py voice --id "${{ inputs.id }}" > voice.log 2>&1; then cat voice.log
          elif grep -q NO_EPISODES_LEFT voice.log; then echo "Every episode is rendered or posted. Add more to author/episodes.json."; echo "done=1" >> $GITHUB_OUTPUT
          else cat voice.log; exit 1; fi

      - name: Animate Hamish (Wav2Lip lip-sync)
        if: steps.queue.outputs.full != '1' && steps.voice.outputs.done != '1'
        run: |
          git clone -q --depth 1 https://github.com/Rudrabha/Wav2Lip.git
          cd Wav2Lip
          pip install -q torch==1.12.1+cpu torchvision==0.13.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -q "numpy==1.23.5" "librosa==0.9.2" "numba==0.56.4" opencv-python-headless==4.7.0.72 tqdm scipy
          for u in https://huggingface.co/camenduru/Wav2Lip/resolve/main/checkpoints/wav2lip_gan.pth \
                   https://huggingface.co/numz/wav2lip_studio/resolve/main/Wav2lip/wav2lip_gan.pth; do
            curl -sSfL -o checkpoints/wav2lip_gan.pth "$u" && break
          done
          curl -sSfL -o face_detection/detection/sfd/s3fd.pth https://www.adrianbulat.com/downloads/python-fan/s3fd-619a316812.pth \
            || curl -sSfL -o face_detection/detection/sfd/s3fd.pth https://huggingface.co/camenduru/Wav2Lip/resolve/main/face_detection/detection/sfd/s3fd.pth
          for part in open close; do
            python inference.py --checkpoint_path checkpoints/wav2lip_gan.pth --face ../work/portrait.jpg \
              --audio ../work/$part-16k.wav --outfile ../work/$part.mp4 --pads 0 15 0 0 --resize_factor 1 --nosmooth
          done

      - name: Compose and add to the queue
        if: steps.queue.outputs.full != '1' && steps.voice.outputs.done != '1'
        run: |
          python author/make_episode.py compose
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add author/rendered
          git commit -m "Author Short rendered: ${{ steps.voice.outputs.episode }}"
          git pull --rebase origin main
          git push origin HEAD:main
