# Renders "Hamish talks about the book" episodes into the queue (author/rendered/), ahead of time.
# Rendering on GitHub's CPU machines is slow (30-60+ min), so it runs at night and keeps a buffer
# of up to 4 episodes ready. Posting is a separate, quick job: author-post.yml.
name: Author Shorts - render

on:
  # schedule switched on once the first episode is approved:
  # schedule:
  #   - cron: '23 1 * * *'   # nightly, 01:23 UTC
  workflow_dispatch:
    inputs:
      id:
        description: 'Episode id to (re-)render (blank = next one not yet rendered)'
        default: ''
      sharpen:
        description: 'Sharpen the face with GFPGAN (much slower)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: author-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Is the queue full?
        id: queue
        run: |
          ready=0
          for f in author/rendered/*.mp4; do [ -e "$f" ] || continue; id=$(basename "$f" .mp4); grep -qx "$id" author/posted.txt 2>/dev/null || ready=$((ready+1)); done
          echo "$ready episode(s) waiting in the queue"
          if [ -z "${{ inputs.id }}" ] && [ $ready -ge 4 ]; then echo "full=1" >> $GITHUB_OUTPUT; fi

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.full != '1'
        with:
          python-version: '3.8'

      - name: Tools
        if: steps.queue.outputs.full != '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1 > /dev/null
          pip install -q pillow
          curl -sSL https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz | tar xz
          H=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_GB/vctk/medium
          curl -sSfL -o vctk.onnx $H/en_GB-vctk-medium.onnx
          curl -sSfL -o vctk.onnx.json $H/en_GB-vctk-medium.onnx.json

      - name: Voice
        id: voice
        if: steps.queue.outputs.full != '1'
        run: |
          if python author/make_episode.py voice --id "${{ inputs.id }}" > voice.log 2>&1; then cat voice.log
          elif grep -q NO_EPISODES_LEFT voice.log; then echo "Every episode is rendered or posted. Add more to author/episodes.json."; echo "done=1" >> $GITHUB_OUTPUT
          else cat voice.log; exit 1; fi

      - name: Animate Hamish (SadTalker)
        if: steps.queue.outputs.full != '1' && steps.voice.outputs.done != '1'
        run: |
          git clone -q --depth 1 https://github.com/OpenTalker/SadTalker.git
          cd SadTalker
          pip install -q torch==1.12.1+cpu torchvision==0.13.1+cpu torchaudio==0.12.1 --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
          bash scripts/download_models.sh > /dev/null 2>&1
          ENH=""; [ "${{ inputs.sharpen }}" = "true" ] && ENH="--enhancer gfpgan"
          for part in open close; do
            python inference.py --driven_audio ../work/$part-16k.wav --source_image ../work/portrait.jpg \
              --result_dir ../work/st-$part --still --preprocess full $ENH --cpu --size 256
            cp "$(find ../work/st-$part -name '*.mp4' | head -1)" ../work/$part.mp4
          done

      - name: Compose and add to the queue
        if: steps.queue.outputs.full != '1' && steps.voice.outputs.done != '1'
        run: |
          python author/make_episode.py compose
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add author/rendered
          git commit -m "Author Short rendered: ${{ steps.voice.outputs.episode }}"
          git pull --rebase origin main
          git push origin HEAD:main
