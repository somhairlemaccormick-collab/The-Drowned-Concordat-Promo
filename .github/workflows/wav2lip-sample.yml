# Test: build an author episode with Wav2Lip (mouth-only lip-sync, much faster on CPU than SadTalker).
# The finished video and the log go to the author-media-wav2lip branch.
name: Author Shorts - Wav2Lip sample

on:
  workflow_dispatch:
    inputs:
      id:
        description: 'Episode id'
        default: '01-welcome-to-the-delta'

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Voice (Kokoro, "Fable")
        id: voice
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1 > /dev/null
          pip install -q pillow soundfile "kokoro>=0.9.4"
          if python author/make_episode.py voice --id "${{ inputs.id }}" > voice.log 2>&1; then cat voice.log
          elif grep -q NO_EPISODES_LEFT voice.log; then echo "Every episode is rendered or posted. Add more to author/episodes.json."; echo "done=1" >> $GITHUB_OUTPUT
          else cat voice.log; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Lip-sync and compose
        run: |
          set -o pipefail
          {
          set -x
          pip install -q pillow
          git clone -q --depth 1 https://github.com/Rudrabha/Wav2Lip.git
          cd Wav2Lip
          pip install -q torch==1.12.1+cpu torchvision==0.13.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -q "numpy==1.23.5" "librosa==0.9.2" "numba==0.56.4" opencv-python-headless==4.7.0.72 tqdm scipy
          for u in https://huggingface.co/camenduru/Wav2Lip/resolve/main/checkpoints/wav2lip_gan.pth \
                   https://huggingface.co/numz/wav2lip_studio/resolve/main/Wav2lip/wav2lip_gan.pth; do
            curl -sSfL -o checkpoints/wav2lip_gan.pth "$u" && break
          done
          curl -sSfL -o face_detection/detection/sfd/s3fd.pth https://www.adrianbulat.com/downloads/python-fan/s3fd-619a316812.pth \
            || curl -sSfL -o face_detection/detection/sfd/s3fd.pth https://huggingface.co/camenduru/Wav2Lip/resolve/main/face_detection/detection/sfd/s3fd.pth
          for part in open close; do
            python inference.py --checkpoint_path checkpoints/wav2lip_gan.pth --face ../work/portrait.jpg \
              --audio ../work/$part-16k.wav --outfile ../work/$part.mp4 --pads 0 15 0 0 --resize_factor 1 --nosmooth
          done
          cd ..
          python author/make_episode.py compose
          } 2>&1 | tee log.txt
      - name: Save results
        if: always()
        run: |
          mkdir -p pub && cp author/rendered/*.mp4 pub/ 2>/dev/null; cp work/open.mp4 pub/open-raw.mp4 2>/dev/null; cp log.txt voice.log pub/ 2>/dev/null
          cd pub && git init -q -b x && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Wav2Lip sample run $GITHUB_RUN_NUMBER"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/author-media-wav2lip
